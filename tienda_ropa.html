<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda Fray</title>

  <link rel="stylesheet" href="assets/css/tienda.css"/>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />
</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <!-- DESKTOP -->

    <nav class="menu desktop">

        <div class="logo-contenedor">

            <a href="index.html">

                <img
                src="assets/img/logotipo_noche.jpeg"
                alt="logo"
                class="logo"/>

            </a>

        </div>

        <ul>

            <li><a href="#Hombres">Hombre</a></li>

            <li><a href="#Mujeres">Mujer</a></li>

            <li><a href="#Deporte">Deporte</a></li>

        </ul>

    </nav>

    <!-- MOBILE -->

    <nav class="mobile-header">

        <!-- LOGO -->

        <a href="index.html">

            <img
            src="assets/img/logotipo_noche.jpeg"
            alt="logo"
            class="logo-mobile"/>

        </a>

        <!-- BOTON MENU -->

        <div class="hamburguesa"
        onclick="toggleMenu()">

            <i class="fa-solid fa-bars"></i>

        </div>

    </nav>

    <!-- MENU LATERAL MOBILE -->

    <div class="menu-mobile"
    id="menuMobile">

        <div class="top-menu-mobile">

            <h2>Menú</h2>

            <button onclick="toggleMenu()">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <ul>

            <li>

                <a href="#Hombres"
                onclick="toggleMenu()">

                    <i class="fa-solid fa-person"></i>

                    Hombre

                </a>

            </li>

            <li>

                <a href="#Mujeres"
                onclick="toggleMenu()">

                    <i class="fa-solid fa-person-dress"></i>

                    Mujer

                </a>

            </li>

            <li>

                <a href="#Deporte"
                onclick="toggleMenu()">

                    <i class="fa-solid fa-futbol"></i>

                    Deporte

                </a>

            </li>

        </ul>

    </div>

    <!-- OVERLAY -->

    <div class="overlay"
    id="overlay"
    onclick="toggleMenu()"></div>

</header>

  <!-- FONDO -->

  <div class="fondo_tienda"></div>

  <!-- NEW IN -->

  <h2>New In</h2>

  <section class="productos" id="new-in">
    <!-- PRODUCTOS AUTOMATICOS -->
  </section>

  <!-- HOMBRES -->

  <div id="fondos">
    <img src="assets/img/081733aa00e4e60192bc20b9533583f4.jpg" alt="">
  </div>

  <br>

  <section>
    <h2 id="Hombres">Hombres</h2>
    <h3><a href="#">Ver todo</a></h3>
  </section>

  <section class="productos" id="productos-hombre">
    <!-- PRODUCTOS AUTOMATICOS -->
  </section>

  <!-- MUJERES -->

  <div id="fondos">
    <img src="assets/img/fondomujer.jpg" alt="">
  </div>

  <br><br>

  <section>
    <h2 id="Mujeres">Mujeres</h2>
    <h3><a href="#">Ver todo</a></h3>
  </section>

  <section class="productos" id="productos-mujer">
    <!-- PRODUCTOS AUTOMATICOS -->
  </section>

  <!-- DEPORTE -->

  <div id="fondos">
    <img src="assets/img/productos/camisetas.jpg" alt="">
  </div>

  <br>

  <section>
    <h2 id="Deporte">Camisetas de Futbol</h2>
    <h3><a href="#">Ver todo</a></h3>
  </section>

  <section class="productos" id="productos-deporte">
    <!-- PRODUCTOS AUTOMATICOS -->
  </section>

  <!-- CARRITO -->

<!-- =========================
     ICONO CARRITO SUPERIOR
========================= -->

<!-- ICONO CARRITO -->

<div class="icono-carrito" onclick="toggleCarrito()">

    <i class="fa-solid fa-cart-shopping"></i>

    <span id="contador-carrito">0</span>

</div>

<!-- CARRITO -->

<div class="carrito-lateral" id="carrito">

    <div class="top-carrito">

        <h2>Carrito</h2>

        <button onclick="toggleCarrito()">
            X
        </button>

    </div>

    <div id="lista-carrito"></div>

    <h3 id="total">
        Total: $0
    </h3>

    <button onclick="enviarWhatsApp()" class="btn-whatsapp">
        Comprar por WhatsApp
    </button>

</div>

  <!-- FOOTER -->

  <footer>
    <p>&copy; 2025 Fray Mercado. Todos los derechos reservados.</p>
  </footer>

  <!-- JAVASCRIPT -->

  <script src="assets/js/app.js"></script>

</body>
</html>
